{{ define "main" }}
<div class="home-page">
    <h1>{{ .Site.Title }}</h1>
    <p>Bienvenue sur mon carnet de blog</p>
    <p>Une expérience de co-construction d'un blog avec l'aide de l'IA</p>
    <p>Mon blog est actuellement en reconstruction</p>
    
    <hr>
    
    <h2>Articles récents</h2>
    <ul>
        {{ range first 5 .Site.RegularPages }}
            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
    </ul>
</div>
{{ end }}
