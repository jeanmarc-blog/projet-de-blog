baseurl = "/"
languageCode = "fr-fr"
theme = "terminal"
paginate = 3

[params]
  # dir name of your blog content (default is `content/posts`)
  contentTypeName = "posts"
  # ["orange", "blue", "red", "green", "pink"]
  themeColor = "blue"
  # if you set this to 0, only submenu trigger will be visible
  showMenuItems = 7
  # show selector to switch language
  showLanguageSelector = false
  # set theme to full screen width
  fullWidthTheme = false
  # center theme with default width
  centerTheme = true
  # set a custom favicon (default is a `themeColor` square)
  # favicon = "favicon.ico"


[languages]
  [languages.fr]
    languageName = "Français"
    title = "Mon carnet de blog | Une expérience avec l'aide de l'IA"
    keywords = ""
    copyright = ""
    menuMore = "En savoir plus"
    readMore = "continuer"
    readOtherPosts = "à lire aussi"

    [languages.fr.params.logo]
      logoText = "Mon carnet de blog | Une expérience avec l'aide de l'IA"
      logoHomeLink = "/"

    [languages.fr.menu]
      [[languages.en.menu.main]]
        identifier = "auteur"
        name = "auteur"
        url = "/about"

    [[languages.fr.menu.main]]
        identifier = "now"
        name = "now"
        url = "/now"
      
    [[languages.fr.menu.main]]
        identifier = "contact"
        name = "contact"
        url = "/contact"  
        
      [[languages.fr.menu.main]]
        identifier = "philosophie"
        name = "philosophie"
        url = "/philosophie" 

      [[languages.fr.menu.main]]
        identifier = "parcours"
        name = "parcours"
        url = "/mon-parcours"

 	    [[languages.fr.menu.main]]
        identifier = "perspectives"
        name = "perspectives"
        url = "/perspectives"

      [[languages.fr.menu.main]]
        identifier = "sources"
        name = "sources"
        url = "/sources"  

disqusShortname = "https-carnetdeblog-netlify-app"
