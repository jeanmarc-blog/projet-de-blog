baseurl = "https://carnetdeblog.netlify.app/"
defaultContentLanguage = "fr"
theme = "terminal"
paginate = 3

[params]
# Indiquez le chemin relatif de votre fichier custom.css depuis le dossier assets ou static
  contentTypeName = "posts"
  themeColor = "blue"
  favicon = "img/favicon/vert.png"
  showMenuItems = 7
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  
  

[languages]
  [languages.fr]
    label = "Français"
    title = "Mon carnet numérique"
    keywords = ""
    copyright = ""
    menuMore = "En savoir plus"
    readMore = "continuer"
    readOtherPosts = "à lire aussi"

    [languages.fr.params.logo]
      logoText = "Mon carnet numérique | Une expérience avec l'aide de l'IA"
      logoHomeLink = "/"

    [languages.fr.menu]
      [[languages.fr.menu.main]]
        identifier = "auteur"
        name = "auteur"
        url = "/about"
      [[languages.fr.menu.main]]
      	identifier = "blog"
	name = "blog"
	url = "/posts"

      [[languages.fr.menu.main]]
        identifier = "actuel"
        name = "actuel"
        url = "/actuel"

      [[languages.fr.menu.main]]
        identifier = "contact"
        name = "contact"
        url = "/contact"

      [[languages.fr.menu.main]]
        identifier = "Carnets"
        name = "carnets"
        url = "/carnets/"


disqusShortname = "https-carnetdeblog-netlify-app"
